# ==============================================================================
# XIMPLY Vision - Broker configuration
# ==============================================================================
# Read by the optional mosquitto service. What this file assumes, and what has
# to change before the broker leaves the machine, is written down in
# doc/sec/SEC-0011-broker-and-live-frame-exposure.md.

listener 1883

# Anonymous connections are accepted because the published port is bound to the
# loopback address in the compose file. Both of those have to change together:
# a broker reachable from anywhere with this line still set is a broker anybody
# can read a room from. Set a password file and per-user topic ACLs first.
allow_anonymous true

# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Nothing is written to disk. Messages carrying images must not outlive the
# process that published them, which is the rule ADR-0023 sets for frames and
# the reason a queued message is never persisted here either.
persistence false

# Frames are JPEG and can be larger than the default limit.
message_size_limit 10485760

log_dest stdout
log_type warning
log_type error
