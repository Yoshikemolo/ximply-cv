# ==============================================================================
# XIMPLY Vision Nginx Configuration
# ==============================================================================

server {
    listen 80;
    # Also listen on IPv6: inside the container "localhost" resolves to ::1
    # first, so an IPv4 only socket makes the health check fail against a
    # server that is serving pages perfectly well.
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Freezing an asset for a year is only safe when its name changes with its
    # content. The production build hashes its bundle filenames, but the
    # development build emits a bare main.js, and marking that immutable meant
    # a browser held the previous build indefinitely: every deployment appeared
    # to do nothing at all.
    location ~* "-[A-Za-z0-9]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unhashed scripts and styles must be revalidated. The ETag makes that a
    # 304 in the normal case, so the cost is one round trip, not a redownload.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Media and fonts are content addressed by the build or genuinely static.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy (when using nginx as reverse proxy)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
    }

    # Angular routing - serve index.html for all routes
    #
    # index.html must never be cached. Its filename is stable while the bundle
    # filenames are content hashed, so a browser holding an old copy keeps
    # asking for the previous build's chunks and never sees a deployment. The
    # hashed assets above stay immutable, which is what makes that safe.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # Disable logging for favicon and robots
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
}
