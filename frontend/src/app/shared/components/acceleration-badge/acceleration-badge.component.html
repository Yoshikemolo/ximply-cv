@if (status(); as info) {
  <span
    class="accel-badge"
    [class.accel-badge--inactive]="!info.active"
    [title]="tooltip()"
  >
    <span class="accel-badge__dot"></span>
    <span class="accel-badge__label">
      {{ (info.active ? 'acceleration.badge' : 'acceleration.badgeInactive') | translate }}
    </span>
  </span>
}
