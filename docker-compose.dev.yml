# ==============================================================================
# XIMPLY Vision - Development Environment Overrides
# ==============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ----------------------------------------------------------------------------
  # Database - Development
  # ----------------------------------------------------------------------------
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: ximply_vision_dev

  # ----------------------------------------------------------------------------
  # MinIO - Development
  # ----------------------------------------------------------------------------
  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devadmin
      MINIO_ROOT_PASSWORD: devpassword

  # ----------------------------------------------------------------------------
  # Backend - Development
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DEBUG: "true"
      USE_MOCK_SERVICES: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@db:5432/ximply_vision_dev
      MINIO_ACCESS_KEY: devadmin
      MINIO_SECRET_KEY: devpassword
      JWT_SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:4200", "http://127.0.0.1:4200"]'
    volumes:
      # Mount source code for hot reload
      - ./backend/app:/app/app:ro
      - backend-storage:/app/storage
      - model-weights:/app/models/weights
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ----------------------------------------------------------------------------
  # Frontend - Development
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "4200:80"
