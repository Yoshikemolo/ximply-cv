# ==============================================================================
# XIMPLY Vision - Development Environment Overrides
# ==============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ----------------------------------------------------------------------------
  # Database - Development
  # ----------------------------------------------------------------------------
  db:
    ports:
      - "${DB_PORT:-5432}:5432"
    # Credentials come from the base file and .env. POSTGRES_PASSWORD only takes
    # effect when the data volume is first initialised, so hardcoding a different
    # password here would silently break every later start.

  # ----------------------------------------------------------------------------
  # MinIO - Development
  # ----------------------------------------------------------------------------
  minio:
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    # Credentials come from the base file and .env, so the backend and the
    # console always agree with the stored objects.

  # ----------------------------------------------------------------------------
  # Backend - Development
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        # Brings pytest and the linters into the image, so the suite runs
        # against the same interpreter and the same installed versions the
        # application runs on. A production image is built without this.
        INSTALL_DEV: "true"
    environment:
      DEBUG: "true"
      JWT_SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-4200}", "http://127.0.0.1:${FRONTEND_PORT:-4200}"]'
    volumes:
      # Mount source code for hot reload
      - ./backend/app:/app/app:ro
      # The suite, mounted rather than copied, so a test edited on the host is
      # the test that runs here. Read only for the same reason the source is:
      # nothing in the container should be writing back into the repository.
      - ./backend/tests:/app/tests:ro
      # The pytest configuration lives in pyproject, and mounting it keeps the
      # container reading the same settings as a developer running the suite
      # locally, rather than whichever copy was baked into the image.
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - backend-storage:/app/storage
      - model-weights:/app/models/weights
      - face-models:/home/appuser/.insightface
      - vlm-models:/home/appuser/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # The reload watcher is pointed at the application rather than at /app,
    # which now also holds the suite and the project file. Without this, editing
    # a test restarts the server, and a restart mid-request is how a hot reload
    # ends up hanging on a stream that never closes.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app

  # ----------------------------------------------------------------------------
  # Frontend - Development
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "${FRONTEND_PORT:-4200}:80"
