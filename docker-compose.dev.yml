# ==============================================================================
# XIMPLY Vision - Development Environment Overrides
# ==============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ----------------------------------------------------------------------------
  # Database - Development
  # ----------------------------------------------------------------------------
  db:
    ports:
      - "${DB_PORT:-5432}:5432"
    # Credentials come from the base file and .env. POSTGRES_PASSWORD only takes
    # effect when the data volume is first initialised, so hardcoding a different
    # password here would silently break every later start.

  # ----------------------------------------------------------------------------
  # MinIO - Development
  # ----------------------------------------------------------------------------
  minio:
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    # Credentials come from the base file and .env, so the backend and the
    # console always agree with the stored objects.

  # ----------------------------------------------------------------------------
  # Backend - Development
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DEBUG: "true"
      JWT_SECRET_KEY: dev-secret-key-not-for-production
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-4200}", "http://127.0.0.1:${FRONTEND_PORT:-4200}"]'
    volumes:
      # Mount source code for hot reload
      - ./backend/app:/app/app:ro
      - backend-storage:/app/storage
      - model-weights:/app/models/weights
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ----------------------------------------------------------------------------
  # Frontend - Development
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "${FRONTEND_PORT:-4200}:80"
