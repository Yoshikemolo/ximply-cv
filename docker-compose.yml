# ==============================================================================
# XIMPLY Vision - Docker Compose Base Configuration
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ximply-vision-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ximply_vision}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ximply_vision}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ximply-network

  # ----------------------------------------------------------------------------
  # MinIO Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ximply-vision-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - ximply-network

  # ----------------------------------------------------------------------------
  # MQTT Broker
  # ----------------------------------------------------------------------------
  # Optional, and started only with `--profile broker`. A deployment that wants
  # events on a socket rather than on a broker never runs this, and the backend
  # reconnects on its own whenever it does appear.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ximply-vision-mosquitto
    restart: unless-stopped
    profiles: ["broker"]
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Bound to the loopback address on purpose: the shipped configuration
    # accepts anonymous connections. See SEC-0011 before changing either.
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -h localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ximply-network

  # ----------------------------------------------------------------------------
  # Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ximply-vision-backend
    restart: unless-stopped
    env_file:
      # Optional: the stack starts with the defaults below when .env is absent
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ximply_vision}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    volumes:
      - backend-storage:/app/storage
      - model-weights:/app/models/weights
      # The face models are a 275 MB download on first use. Without this the
      # stack would fetch them again on every container recreate.
      - face-models:/home/appuser/.insightface
      # The description model is several gigabytes. Without this it would be
      # fetched again on every container recreate.
      - vlm-models:/home/appuser/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ximply-network

  # ----------------------------------------------------------------------------
  # Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-production}
    container_name: ximply-vision-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ximply-network

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres-data:
    name: ximply-vision-postgres
  minio-data:
    name: ximply-vision-minio
  backend-storage:
    name: ximply-vision-storage
  model-weights:
    name: ximply-vision-models
  face-models:
    name: ximply-vision-face-models
  vlm-models:
    name: ximply-vision-vlm-models

# ==============================================================================
# Networks
# ==============================================================================
networks:
  ximply-network:
    name: ximply-vision-network
    driver: bridge
